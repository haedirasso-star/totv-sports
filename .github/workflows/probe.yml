name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          curl -s "$B/all/scoreboard?dates=20261103" -o all3.json
          curl -s "$B/all/scoreboard?dates=20261103-20261109" -o allw.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/all/teams/83/schedule?fixture=true" -o bar_fix.json
          curl -s "https://site.web.api.espn.com/apis/site/v2/sports/soccer/all/teams/83/schedule?fixture=true" -o bar_fix2.json
          curl -s "$B/esp.1/teams/83" -o bar_team.json
          curl -s "$B/fifa.worldq.afc/teams" -o afc_teams.json
          curl -s "$B/fifa.world/teams" -o wc_teams.json
          curl -sI "https://a.espncdn.com/i/teamlogos/soccer/500/83.png" -o logo_head.txt
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

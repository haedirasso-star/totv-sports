name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          F=https://hlmaksidfqdarwunedqj.supabase.co/functions/v1/push
          sleep 25
          curl -s -X POST "$F" -H 'Content-Type: application/json' -d '{"action":"live_tick"}' -o tick.json; cat tick.json; echo
          for u in https://cdn.totv.app/live/clubs.json https://cdn.totv.app/live/live.json https://cdn.totv.app/live/logos/83.png; do curl -s -o /dev/null -w "%{http_code} %{size_download} $u\n" "$u"; done
          curl -s https://cdn.totv.app/live/clubs.json -o clubs.json; curl -s https://cdn.totv.app/live/live.json -o live.json
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

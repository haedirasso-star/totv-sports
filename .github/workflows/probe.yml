name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          curl -s https://cdn.totv.app/feeds/plans.json -o plans.json; head -c 3000 plans.json; echo
          curl -s https://cdn.totv.app/config.json | jq '.payment_numbers' > pay.json; cat pay.json | head -50
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          for i in 202 205 448 478 481 482 164 162 449 655 2917 8346 4375; do echo "$i $(curl -s "$B/fifa.world/teams/$i" | jq -r '.team.displayName')" >> ids.txt; done
          curl -s "$B/ksa.1/scoreboard" | jq '{n:(.events|length), logo:.leagues[0].logos[0].href, name:.leagues[0].name}' > ksa.json
          cat ids.txt ksa.json
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

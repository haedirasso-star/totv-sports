name: diag
# فحص سريع: هل السيرفر يستجيب لخوادم GitHub؟ وهل ملفات موقعنا على cdn.totv.app موجودة؟
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          XTREAM_HOST: ${{ secrets.XTREAM_HOST }}
          XTREAM_USER: ${{ secrets.XTREAM_USER }}
          XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
        run: |
          H="${XTREAM_HOST%/}"
          for a in "" "&action=get_vod_categories" "&action=get_vod_streams"; do
            r=$(curl -s -o /tmp/x -w '%{http_code} %{size_download} %{time_total}' --max-time 90 -A 'VLC/3.0.20 LibVLC/3.0.20' \
              "$H/player_api.php?username=$XTREAM_USER&password=$XTREAM_PASS$a" || echo "ERR")
            echo "::notice::xtream${a:-:auth} => $r head=$(head -c 60 /tmp/x | tr -d '\n\r"' | sed 's/[^A-Za-z0-9 :{},_-]//g')"
          done
          for f in catalog/index.json catalog/home.json config.json feeds/reels.json matches.json; do
            r=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 20 "https://cdn.totv.app/$f?d=$RANDOM" || echo ERR)
            echo "::notice::cdn $f => $r"
            r=$(curl -s -o /dev/null -w '%{http_code} %{size_download}' --max-time 20 "https://haedirasso-star.github.io/totv-sports/$f?d=$RANDOM" || echo ERR)
            echo "::notice::pages $f => $r"
          done

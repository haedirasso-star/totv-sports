name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          F=https://hlmaksidfqdarwunedqj.supabase.co/functions/v1/push
          sleep 30
          curl -s -X POST "$F" -H 'Content-Type: application/json' -d '{"action":"live_tick"}' > t1.json; cat t1.json; echo
          curl -s https://cdn.totv.app/live/live.json | jq -c '[.games[]|select(.lu!=null)|{h:.h.ar,a:.a.ar,p:[.lu.home.xi[]?|{n,ph,iso}][0:4]}][0:2]' > lu.json; cat lu.json
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

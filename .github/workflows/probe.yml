name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          for l in eng.1 ita.1 ger.1 fra.1 ksa.1 esp.1 por.1 ned.1 tur.1 egy.1 uae.1 qat.1; do curl -s "$B/$l/teams" | jq -r --arg l $l '.sports[0].leagues[0].teams[].team|$l+" "+.id+" "+.displayName' >> teams.txt; done
          curl -s "$B/uefa.champions/summary?event=401915311" -o sum_pre.json
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

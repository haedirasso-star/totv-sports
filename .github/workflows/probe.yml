name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          curl -s -L -A "Mozilla/5.0" -o doc.html -w "%{http_code} %{size_download}\n" https://maxtv-panel.com/iptv/api/ > code.txt; cat code.txt
          python3 -c "import re,html;t=open('doc.html',errors='ignore').read();t=re.sub(r'(?s)<(script|style).*?</\\1>','',t);t=re.sub(r'<[^>]+>','\\n',t);t=html.unescape(t);t=re.sub(r'\\n\\s*\\n+','\\n',t);open('doc.txt','w').write(t)"
          head -c 400 doc.txt
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write

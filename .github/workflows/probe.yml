name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out; cd out
          B=https://site.api.espn.com/apis/site/v2/sports/soccer
          curl -s "$B/uefa.champions/scoreboard?dates=20261103" -o ucl.json
          curl -s "$B/esp.1/scoreboard?dates=20261101" -o esp_y.json
          curl -s "$B/eng.1/scoreboard?dates=20261101" -o eng_y.json
          curl -s "$B/esp.1/teams" -o esp_teams.json
          curl -s "$B/irq.1/teams" -o irq_teams.json
          curl -s "https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard" -o all.json
          ID=$(jq -r '.events[0].id' esp_y.json); echo "id=$ID"
          curl -s "$B/esp.1/summary?event=$ID" -o sum.json
          curl -s "https://site.web.api.espn.com/apis/site/v2/sports/soccer/all/teams/83/schedule" -o bar_sched.json
          curl -s "$B/fifa.worldq.afc/scoreboard" -o afc.json
          ls -la
      - run: |
          cd out; git init -q; git checkout -q -b probe-out; git add .; git -c user.name=ci -c user.email=ci@x commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
    permissions:
      contents: write
